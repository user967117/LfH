name: Build and Push to ACR

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Отримуємо код
      uses: actions/checkout@v4

    - name: Логінимось в Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Збираємо та пушимо Docker імедж
      run: |
        if [ -f "LawFirmsHelper/LawFirmsHelper/Dockerfile" ]; then
          echo "Dockerfile знайдено у внутрішній папці!"
          docker build -f LawFirmsHelper/LawFirmsHelper/Dockerfile -t ${{ secrets.ACR_LOGIN_SERVER }}/lawfirmshelper:latest ./LawFirmsHelper
        elif [ -f "LawFirmsHelper/Dockerfile" ]; then
          echo "Dockerfile знайдено у зовнішній папці!"
          docker build -f LawFirmsHelper/Dockerfile -t ${{ secrets.ACR_LOGIN_SERVER }}/lawfirmshelper:latest ./LawFirmsHelper
        else
          echo "ПОМИЛКА: Dockerfile не знайдено! Перевір назву файлу."
          exit 1
        fi
        
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/lawfirmshelper:latest
